# 阈值
disaster:
  # 致灾因子
  hazards: ['elevation', 'slope', 'waterDistance', 'vegetationCoverage',
            'rainfall', 'duration', 'rockType']

  # 次生灾害
  secondary: ['landslide', 'debris_flow', 'torrential_flood', 'water_logging', 'barrier_lake']

  # 次生灾害中英文对应关系
  secondary_en_zh: {
    '滑坡': 'landslide',
    '泥石流': 'debris_flow',
    '山洪': 'torrential_flood',
    '洪水': 'torrential_flood',
    '内涝': 'water_logging',
    '堰塞湖': 'barrier_lake',
    'landslide': 'landslide',
    'debris_flow': 'debris_flow',
    'torrential_flood': 'torrential_flood',
    'water_logging': 'water_logging',
  }

  # 高程
  elevation:
    range: [400, 700]
    label: ['低', '中', '高']
#    probability: [0.3, 0.3, 0.4]   # 先验概率的值，可以自行设置

  # 坡度
  slope:
    range: [ 5, 25, 45, 65 ]
    label: ['极缓', '缓', '中', '陡', '极陡']
#    probability: [0.001, 0.2, 0.6, 0.1, 0.099]

  # 距河道距离
  waterDistance:
    range: [1500, 3000]
    label: ['近', '中', '远']

  # 植被覆盖率
  vegetationCoverage:
    range: [10, 30, 60, 80]
    label: ['极低', '低', '中',  '高', '极高']
#    probability: [0.001, 0.2, 0.6, 0.1, 0.099]

  # 降雨量
  rainfall:
    range: [5, 15, 30, 70, 140]
    label: ['小雨', '中雨', '大雨', '暴雨', '大暴雨', '特大暴雨']
#    probability: [0.001, 0.05, 0.6, 0.3, 0.04, 0.009]
    probability: [0.002, 0.01, 0.08, 0.25, 0.35, 0.308]

  # 持续时间
  duration:
    range: [6, 24, 72]
    label: ['短', '中', '长', '超长']
#    probability: [0.5,0.2,0.15,0.15]

  # 岩体性质
  rockType:
    range: [0, 1, 2, 3, 4]
    label: ['花岗岩', '黄土-古土壤', '黄土-砂岩互层', '片麻岩', '砂岩', '页岩']
#    probability: [0.001, 0.35, 0.35, 0.001, 0.001, 0.297]

  # 滑坡
  landslide:
    label: ['不发生', '发生']
    discreteValue: [0, 1]   # 离散值
    hazards: ['slope', 'rockType', 'vegetationCoverage', 'rainfall']
    result: '发生'  # 预测结果关注字段

  # 泥石流
  debris_flow:
    label: ['不发生', '发生']
    discreteValue: [0, 1]
    hazards: ['slope', 'rockType', 'vegetationCoverage', 'rainfall']
    result: '发生'

  # 山洪
  torrential_flood:
    label: ['不发生', '发生']
    discreteValue: [0, 1]
    hazards: ['slope', 'rainfall', 'duration', 'waterDistance', 'barrier_lake']
    result: '发生'

  # 内涝
  water_logging:
    label: ['不发生', '发生']
    discreteValue: [0, 1]
    hazards: ['elevation', 'duration', 'slope', 'rainfall', 'vegetationCoverage']
    result: '发生'

  # 堰塞湖
  barrier_lake:
    label: ['不发生', '发生']
    discreteValue: [0, 1]
    hazards: ['landslide', 'debris_flow']
    result: '发生'

# 贝叶斯节点结构
bayes:
  nodes:
    # 致灾因子 → 滑坡
    - ['slope', 'landslide']
    - ['rockType', 'landslide']
    - ['vegetationCoverage', 'landslide']
    - ['rainfall', 'landslide']

    # 致灾因子 → 泥石流
    - ['slope', 'debris_flow']
    - ['rockType', 'debris_flow']
    - ['vegetationCoverage', 'debris_flow']
    - ['rainfall', 'debris_flow']

    # 致灾因子+堰塞湖 → 山洪
    - ['slope', 'torrential_flood']
    - ['rainfall', 'torrential_flood']
    - ['duration', 'torrential_flood']
    - ['waterDistance', 'torrential_flood']
    - ['barrier_lake', 'torrential_flood']

    # 致灾因子 → 内涝
    - ['elevation', 'water_logging']
    - ['duration', 'water_logging']
    - ['slope', 'water_logging']
    - ['rainfall', 'water_logging']
    - ['vegetationCoverage', 'water_logging']

    # 滑坡+泥石流 → 堰塞湖
    - ['landslide', 'barrier_lake']
    - ['debris_flow', 'barrier_lake']
